<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card</title>
    
    <!-- Modern Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Linked Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Images -->
    <div id="background-container"></div>
    <div id="overlay"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="logo-container" style="display: flex; justify-content: center; gap: 20px;">
            <img id="profile-logo" src="" alt="Bhagirath Fabrication Logo">
            <img id="brand-logo" src="" alt="Nepatop Brand Logo">
        </div>

        <div class="profile-info">
            <h1 id="profile-name"></h1>
            <div class="divider"></div>
            <p id="profile-title"></p>
        </div>

        <!-- Social Icons Row -->
        <div class="socials-row" id="socials-row">
            <!-- Dynamic Socials -->
        </div>

        <!-- Action Grid (Call, Email, Location) -->
        <div class="actions-grid" id="actions-grid">
            <!-- Dynamic Actions -->
        </div>

        <div class="primary-actions">
            <a href="#" class="whatsapp-btn" id="whatsapp-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp Us
            </a>
            <a href="#" class="btn-primary" id="save-contact-btn">
                <i class="fas fa-user-plus"></i> Save Contact
            </a>
        </div>

        <!-- Visiting Card Section -->
        <div class="visiting-card-section" style="margin-top: 30px; width: 100%; text-align: center; animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; animation-delay: 0.6s;">
            <div class="divider" style="margin: 0 auto 30px auto;"></div>
            <img id="visiting-card-img" src="" alt="Visiting Card" style="width: 100%; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px;">
            <a href="#" class="btn-primary" id="save-visiting-card-btn">
                <i class="fas fa-download"></i> Save Visiting Card
            </a>
        </div>
    </div>

    <!-- Linked JavaScript -->
    <script src="script.js?v=1.2"></script>
</body>
</html>
